name: Deploy OCI Frontend

on:
  workflow_run:
    workflows:
      - Build Frontend Image (GHCR)
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oci-frontend
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH 키 로드
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: known_hosts 등록
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${OCI_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$OCI_HOST" >> ~/.ssh/known_hosts

      - name: OCI 프론트 배포 실행 (pull + no-build + health)
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
          OCI_FRONT_DEPLOY_PATH: ${{ secrets.OCI_FRONT_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          FRONTEND_IMAGE: ghcr.io/ohseonghyeon/mocktalkfront:prod-latest
          FRONTEND_BACKEND_BASE_URL: ${{ secrets.FRONTEND_BACKEND_BASE_URL }}
          FRONTEND_OBJECT_STORAGE_BASE_URL: ${{ secrets.FRONTEND_OBJECT_STORAGE_BASE_URL }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${OCI_SSH_PORT:-22}"
          DEPLOY_PATH="${OCI_FRONT_DEPLOY_PATH:-~/mocktalkfront}"
          BACKEND_BASE_URL="${FRONTEND_BACKEND_BASE_URL:-http://backend:8082}"
          OBJECT_STORAGE_BASE_URL="${FRONTEND_OBJECT_STORAGE_BASE_URL:-}"
          FRONT_PORT="${FRONTEND_PORT:-8081}"

          if [ -z "$OBJECT_STORAGE_BASE_URL" ]; then
            echo "FRONTEND_OBJECT_STORAGE_BASE_URL secret is required."
            exit 1
          fi

          ssh -p "$SSH_PORT" "${OCI_USER}@${OCI_HOST}" bash -s <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"
          export FRONTEND_IMAGE="$FRONTEND_IMAGE"
          export BACKEND_BASE_URL="$BACKEND_BASE_URL"
          export OBJECT_STORAGE_BASE_URL="$OBJECT_STORAGE_BASE_URL"
          export FRONTEND_PORT="$FRONT_PORT"

          print_diagnostics() {
            echo "=== deploy diagnostics begin ==="
            df -h || true
            df -i || true
            docker system df || true
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}' || true
            docker images --digests --format 'table {{.Repository}}\t{{.Tag}}\t{{.Digest}}\t{{.Size}}' | head -n 20 || true
            echo "=== deploy diagnostics end ==="
          }

          restart_docker_daemon() {
            if command -v sudo >/dev/null 2>&1; then
              sudo systemctl restart docker || true
              return
            fi
            if command -v systemctl >/dev/null 2>&1; then
              systemctl restart docker || true
              return
            fi
            echo "docker daemon restart skipped: sudo/systemctl not available"
          }

          pull_with_retry() {
            local service="\$1"

            if docker compose -f docker-compose.oci-deploy.yml pull "\$service"; then
              return 0
            fi

            echo "initial pull failed for service=\$service"
            print_diagnostics
            docker image prune -af || true
            restart_docker_daemon
            sleep 3
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker network create mocktalk-internal >/dev/null 2>&1 || true

            if docker compose -f docker-compose.oci-deploy.yml pull "\$service"; then
              return 0
            fi

            echo "retry pull failed for service=\$service"
            print_diagnostics
            return 1
          }

          up_frontend() {
            if docker compose -f docker-compose.oci-deploy.yml up -d --no-build frontend; then
              return 0
            fi

            echo "docker compose up failed for frontend"
            print_diagnostics
            docker compose -f docker-compose.oci-deploy.yml ps || true
            docker logs --tail 200 mocktalk-front || true
            return 1
          }

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker network create mocktalk-internal >/dev/null 2>&1 || true
          pull_with_retry frontend
          up_frontend

          CODE=""
          for i in {1..60}; do
            CODE=\$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:\$FRONTEND_PORT/" || true)
            echo "frontend health check try=\$i code=\$CODE"
            if [ "\$CODE" = "200" ]; then
              break
            fi
            sleep 2
          done

          if [ "\$CODE" != "200" ]; then
            echo "frontend health check failed: status=\$CODE"
            print_diagnostics
            docker compose -f docker-compose.oci-deploy.yml ps || true
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            docker logs --tail 200 mocktalk-front || true
            exit 1
          fi

          docker image prune -f
          EOF

      - name: 배포 완료 요약
        run: |
          echo "OCI 프론트 배포 완료: ghcr.io/ohseonghyeon/mocktalkfront:prod-latest" >> "$GITHUB_STEP_SUMMARY"
