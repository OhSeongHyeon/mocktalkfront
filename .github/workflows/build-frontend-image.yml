name: Build Frontend Image (GHCR)

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - Dockerfile
      - nginx.conf.template
      - vite.config.ts
      - vitest.config.ts
      - tsconfig.json
      - tsconfig.app.json
      - tsconfig.node.json
      - eslint.config.js
      - .prettierrc
      - docker-compose.oci-deploy.yml
      - .github/workflows/frontend-test.yml
      - .github/workflows/build-frontend-image.yml
      - .github/workflows/deploy-oci-frontend.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-frontend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 프론트 테스트 실행
        run: npm run test

      - name: 프론트 빌드 실행
        run: npm run build

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 메타데이터 생성
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ohseonghyeon/mocktalkfront
          tags: |
            type=raw,value=prod-latest
            type=sha,format=short,prefix=sha-

      - name: 프론트 이미지 빌드/푸시 (OCI용 amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 배포 태그 요약
        run: |
          echo "배포 이미지: ghcr.io/ohseonghyeon/mocktalkfront:prod-latest" >> "$GITHUB_STEP_SUMMARY"
